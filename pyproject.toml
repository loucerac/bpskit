[project]
name = "bpskit"
version = "0.1.0"
description = "Shared tools for studies on a BPS (Base Poblacional de Salud, SAS) delivery"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Loucera", email = "clou@us.es" }]
requires-python = ">=3.11"
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "scipy>=1.11",
    "pyarrow>=15",
    "pyyaml>=6",
    "icd-mappings>=0.6.2,<0.7",
]

[project.scripts]
bpskit = "bpskit.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "E501", "F", "I"]
