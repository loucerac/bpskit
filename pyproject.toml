[project]
name = "bpskit"
dynamic = ["version"]
description = "Tools for studies on a BPS (Base Poblacional de Salud) health-records delivery, including an identifier check for outputs leaving a secure data environment"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Carlos Loucera", email = "clou@us.es" }]
requires-python = ">=3.11"
keywords = ["epidemiology", "electronic health records", "ICD-10", "ICD-9", "person-time",
            "trusted research environment", "disclosure control", "snakemake"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=2",
    "pandas>=2.2",
    "scipy>=1.11",
    "pyarrow>=15",
    "pyyaml>=6",
    "icd-mappings>=0.6.2,<0.7",
]

[project.urls]
Homepage = "https://github.com/loucerac/bpskit"
Changelog = "https://github.com/loucerac/bpskit/blob/main/CHANGELOG.md"
Issues = "https://github.com/loucerac/bpskit/issues"

[project.scripts]
bpskit = "bpskit.cli:main"

[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/bpskit/__init__.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E9", "E501", "F", "I"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "CHANGELOG.md", "CITATION.cff", "LICENSE"]
