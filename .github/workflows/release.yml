# Releases bpskit to PyPI.
#
# On every push to main, release-please reads the conventional commits since the
# last release and keeps one release PR open: the next version, its CHANGELOG
# entry and the version bumped in src/bpskit/__init__.py and CITATION.cff.
# Merging that PR tags vX.Y.Z, and the jobs below then test, build and publish
# that tag. They run in this same workflow because a tag created with the
# workflow token does not trigger other workflows. A tag pushed by hand still
# publishes.
#
# PyPI trusted publishing (OIDC), so no token is stored: pypi.org lists this
# repository as a trusted publisher of `bpskit`, workflow release.yml,
# environment `pypi`. release-please needs "Allow GitHub Actions to create and
# approve pull requests" in Settings > Actions > General.
name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release-please:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build:
    needs: release-please
    # always(): on a hand-pushed tag release-please is skipped, not failed.
    if: >-
      always() && (startsWith(github.ref, 'refs/tags/v')
      || needs.release-please.outputs.created == 'true')
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.release-please.outputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: v0.81.0
          locked: true
          cache: true
      - run: pixi run test
      - name: The tag matches the package version
        run: test "${TAG#v}" = "$(pixi run -q python -c 'import bpskit; print(bpskit.__version__)')"
      - run: pixi run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    if: always() && needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
