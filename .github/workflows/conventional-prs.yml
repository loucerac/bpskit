# release-please builds the changelog from commit messages, and a squash merge
# uses the PR title as the commit message, so a PR title must be a conventional
# commit (feat:, fix:, chore:, ...).
name: PR title

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize]

permissions:
  pull-requests: read

jobs:
  conventional-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
