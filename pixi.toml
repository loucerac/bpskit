[workspace]
name = "bpskit"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = "3.12.*"
numpy = ">=2.5.3,<3"
pandas = ">=2.3.3,<3"
scipy = ">=1.18.1,<2"
pyarrow = ">=25.0.0,<26"
pyyaml = ">=6.0.3,<7"
pytest = ">=8,<10"
ruff = ">=0.16.7,<0.17"

[pypi-dependencies]
bpskit = { path = ".", editable = true }

[tasks]
test = "pytest -q"
lint = "ruff check . && ruff format --check ."
fmt = "ruff format . && ruff check --fix ."
